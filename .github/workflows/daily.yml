name: daily-digest

on:
  schedule:
    # ⚠️ 别把 cron 放在 `0` 分（整点）—— GitHub 文档明写整点是高负载时段：
    #    "High load times include the start of every hour. To decrease the chance
    #     of delay, schedule your workflow to run at a different time of the hour."
    #    实测代价：01:00 的任务拖到 06:47 才跑，晚 5 小时 47 分。
    # ⚠️ 同一 workflow 同时只保留一个待跑实例：某个点被塞进队列排很久时，
    #    后面的兜底点会被跳过。所以三个点拉开到 7/27/47 分，给阻塞留出释放窗口。
    #    北京时间 9:07 / 9:27 / 9:47
    - cron: '7 1 * * *'
    - cron: '27 1 * * *'
    - cron: '47 1 * * *'
  workflow_dispatch:       # 第三方定时服务也走这个入口触发
    inputs:
      dry_run:
        description: '只跑不推送、不写库（改完代码后的试跑用）'
        type: boolean
        default: false

# dispatch（cron-job.org）与 schedule 可能并发：两个 job 各自 checkout 到同一份旧
# seen.db，去重双双失效。串行化后，后来的排到时 checkout 能拿到前一个已 push 的新库。
concurrency:
  group: daily-digest
  cancel-in-progress: false

permissions:
  contents: write          # 允许推送状态库到 state 分支

jobs:
  push:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # action 固定到 commit SHA：版本标签可被移动，配上 contents: write 时是供应链风险
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # 状态库放独立 state 分支：master 不再每天多一个 bot 提交。
      - name: Restore seen state
        run: |
          mkdir -p data
          if git fetch --depth=1 origin state 2>/dev/null; then
            git show FETCH_HEAD:data/seen.db > data/seen.db
            echo "已从 state 分支恢复状态库"
          else
            echo "state 分支不存在，本次从空状态库开始"
          fi

      - name: Run digest
        # 定时触发时 github.event.inputs 为空，表达式取空串，等价于 python main.py
        run: python main.py ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
        env:
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          MIMO_API_KEY: ${{ secrets.MIMO_API_KEY }}
          MIMO_BASE_URL: ${{ secrets.MIMO_BASE_URL }}
          MIMO_MODEL: ${{ secrets.MIMO_MODEL }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          # GitHub Search API 拿 AI 热门仓库用。Actions 自动提供，无需用户配置。
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Save seen state
        run: |
          if [ ! -f data/seen.db ]; then
            echo "没有状态库，跳过"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 孤儿分支 + 强制推送：state 分支永远只有 1 个提交，不会无限增长。
          # data/seen.db 在 .gitignore 里，必须 -f 才加得进去。
          git checkout --orphan state-tmp
          git rm -r --cached -q .
          git add -f data/seen.db
          git commit -m "chore: update seen state"
          git push --force origin state-tmp:state

      # 定时任务没人盯，挂了必须让你知道，否则会静默漏推好几天。
      # 走项目脚本而不是 curl：机器人开了签名校验时，裸 curl 会被飞书拒收（19021）。
      - name: Notify failure to Feishu
        if: failure()
        run: python tools/notify_failure.py "${ACTIONS_URL}"
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          ACTIONS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
